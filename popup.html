<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>ExManga Harvester Studio v2.0</title>
  <style>
    body {
      width: 365px;
      margin: 0;
      padding: 14px;
      background: #181a20;
      color: #e8eaed;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #8ab4f8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card {
      background: #22252e;
      border: 1px solid #343946;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .meta-title {
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 4px;
      color: #ffffff;
      word-break: break-word;
    }
    .meta-sub {
      font-size: 11px;
      color: #9aa0a6;
    }
    .perm-banner {
      display: none;
      margin-top: 8px;
      padding: 7px 9px;
      border-radius: 6px;
      background: rgba(251, 188, 4, 0.14);
      border: 1px solid rgba(251, 188, 4, 0.45);
      color: #fde293;
      font-size: 11px;
      line-height: 1.35;
    }
    .perm-banner.visible {
      display: block;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    label {
      font-size: 12px;
      color: #bdc1c6;
    }
    select, input[type="number"], input[type="text"] {
      background: #181a20;
      color: #e8eaed;
      border: 1px solid #3c4043;
      border-radius: 5px;
      padding: 4px 7px;
      font-size: 12px;
      max-width: 195px;
    }
    input[type="number"] {
      width: 64px;
      text-align: center;
    }
    input[type="checkbox"] {
      accent-color: #3186ff;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    button {
      flex: 1;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-weight: 600;
      font-size: 12px;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #3186ff;
      color: #fff;
    }
    .btn-sec {
      background: #353a45;
      color: #e8eaed;
    }
    .btn-danger {
      background: #d93025;
      color: #fff;
    }
    .progress-bar {
      height: 6px;
      background: #2f3440;
      border-radius: 99px;
      overflow: hidden;
      margin: 8px 0 6px 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #3186ff;
      transition: width 0.2s ease;
    }
    .status {
      font-size: 11px;
      color: #9aa0a6;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
  </style>
</head>
<body>
  <h2>
    <span>ExManga Harvester</span>
    <span style="font-size:11px;color:#9aa0a6;font-weight:400;">v2.0</span>
  </h2>

  <div class="card" id="tab-info">
    <div class="meta-title" id="gallery-title">Откройте страницу галереи или читалки</div>
    <div class="meta-sub" id="gallery-sub">Расширение активируется на страницах /g/* и /s/*</div>
    <div class="perm-banner" id="perm-banner"></div>
  </div>

  <div class="card">
    <div class="row">
      <label>Диапазон страниц:</label>
      <div>
        <input type="number" id="start-page" min="1" value="1" />
        <span>—</span>
        <input type="number" id="end-page" min="1" value="1" />
      </div>
    </div>
    <div class="row">
      <label>Формат сохранения:</label>
      <select id="save-mode">
        <option value="folder">В папку &lt;Название манги&gt;</option>
        <option value="cbz">Единый .CBZ архив</option>
        <option value="zip">Единый .ZIP архив</option>
      </select>
    </div>
    <div class="row">
      <label>Имя подпапки:</label>
      <select id="folder-template">
        <option value="{title}">Название манги</option>
        <option value="[{gid}] {title}">[GID] Название манги</option>
        <option value="Manga/{title}">Manga/Название манги</option>
      </select>
    </div>
    <div class="row">
      <label>Качество картинок:</label>
      <select id="quality">
        <option value="webp">Сжатый (ридер)</option>
        <option value="original">Оригинал (fullimg)</option>
      </select>
    </div>
    <div class="row">
      <label>Шаблон имени файла:</label>
      <select id="file-template">
        <option value="{page_pad}_{orig_name}">001_Box_Back.webp</option>
        <option value="{page_pad}">001.webp</option>
      </select>
    </div>
    <div class="row">
      <label>Пауза между стр. (мс):</label>
      <input type="number" id="delay-ms" min="1050" step="100" value="1200" />
    </div>
    <div class="row">
      <label>Повторы зеркала (nl):</label>
      <input type="number" id="max-retries" min="0" max="10" value="3" />
    </div>
    <div class="row">
      <label for="smart-resume">Умная докачка (пропуск готовых):</label>
      <input type="checkbox" id="smart-resume" checked />
    </div>
    <div class="row">
      <label for="include-comicinfo">Добавлять ComicInfo.xml:</label>
      <input type="checkbox" id="include-comicinfo" checked />
    </div>
  </div>

  <div class="card">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="status">
      <span id="status-text">Ожидание запуска</span>
      <span id="counter-text"></span>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-start" disabled>Скачать</button>
      <button class="btn-sec" id="btn-pause" disabled>Пауза</button>
      <button class="btn-danger" id="btn-cancel" disabled>Отмена</button>
    </div>
    <div class="btn-row">
      <button class="btn-sec" id="btn-open-folder">📂 Открыть папку со скачанной мангой</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
